[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-retrieval-notes"
version = "0.2.0"
description = "Enterprise document retrieval with first-search feedback experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "huggingface-hub==0.34.4",
    "pyarrow==21.0.0",
    "numpy==1.26.4",
    "torch==2.6.0",
    "transformers==4.56.1",
    "accelerate==1.10.1",
]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_retrieval = ["prompts/*.txt", "split.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
